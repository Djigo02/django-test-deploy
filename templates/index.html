{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.min.css' %}">
    <title>Formulaire</title>
</head>
<body>
    {%if message %}
        <div class="container my-4">
            {%if message.success %}
                <div class="alert alert-success">
                    {{message.message}}
            {%else %}
                </div>
                <div class="alert alert-danger">
                    {{message.message}}
                </div>
            {%endif%}
        </div>
    {%endif%}
    <div class="my-4 card col-8 offset-2">
        <form class="form border border-1 p-2" method="post" enctype="multipart/form-data">
            {%csrf_token%}
            <div class="form-group mb-3">
                <label class="form-label" >Titre</label>
                <input class="form-control" type="text" name="titre">
            </div>
            <div class="form-group mb-3">
                <label class="form-label" >Image</label>
                <input class="form-control" type="file" name="couverture">
            </div>
            <div class="form-group mb-3">
                <button class="col-4 offset-4 btn btn-primary" >Soumettre</button>
            </div>
        </form>
    </div>
</body>
</html>
